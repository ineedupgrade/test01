<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>청주대 학식 랜덤 추천</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #info {
      padding: 10px;
      background-color: #f8f8f8;
      text-align: center;
    }
    #map {
      width: 100%;
      height: 90%;
    }
    #recommendBtn {
      padding: 10px 20px;
      margin-top: 5px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

  <!-- 네이버 지도 API (지도 띄우기용) -->
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8rfkydvkaa"></script>

  <script>
    let map, marker;

    // 추천 대상 식당 이름 목록
    const names = [
      "청림식당",
      "고봉민김밥 청주대점",
      "스시유메 청주대점"
    ];

    // 지도 초기화
    function initMap() {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(36.6285, 127.4570),
        zoom: 16
      });
    }

    // 랜덤 추천 및 장소 검색
    async function pickRandomRestaurant() {
      const index = Math.floor(Math.random() * names.length);
      const name = names[index];

      const API_URL = `https://naver-search-api.vercel.app/api/search?query=${encodeURIComponent(name)}`;

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const place = data.items?.[0];
        if (!place) {
          alert("장소 정보를 찾을 수 없습니다.");
          return;
        }

        const lat = parseFloat(place.mapy);
        const lng = parseFloat(place.mapx);
        const latlng = new naver.maps.LatLng(lat, lng);

        // 정보 출력
        document.getElementById("result").innerHTML = `
          <strong>${place.title.replace(/<[^>]+>/g, '')}</strong><br>
          ${place.roadAddress || place.address}<br>
          전화번호: ${place.telephone || "없음"}
        `;

        // 마커 업데이트
        if (marker) marker.setMap(null);
        marker = new naver.maps.Marker({
          position: latlng,
          map: map,
          title: place.title
        });

        map.setCenter(latlng);
      } catch (err) {
        console.error("API 호출 오류:", err);
        alert("API 호출 중 오류가 발생했습니다.");
      }
    }

    // 지도 인증 실패 콜백
    window.navermap_authFailure = function () {
      alert("네이버 지도 API 인증에 실패했습니다. 키 또는 도메인 설정을 확인하세요.");
    };
  </script>
</head>
<body onload="initMap()">
  <div id="info">
    <button id="recommendBtn" onclick="pickRandomRestaurant()">오늘 뭐 먹지? 🍽️</button>
    <p id="result">버튼을 눌러 학식을 추천받아보세요!</p>
  </div>
  <div id="map"></div>
</body>
</html>
