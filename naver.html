<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>청주대 학식 랜덤 추천</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #info {
      padding: 10px;
      background-color: #f8f8f8;
      text-align: center;
    }
    #map {
      width: 100%;
      height: 85%;
    }
    #recommendBtn {
      padding: 10px 20px;
      margin-top: 5px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

  <!-- 네이버 지도 API -->
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8rfkydvkaa"></script>

  <script>
    let map, marker;

    const names = [/* 식당 리스트 생략 가능 */];

    function initMap() {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(36.6505, 127.4926),
        zoom: 17
      });
    }

    async function pickRandomRestaurant() {
      const latlng = new naver.maps.LatLng(36.648216, 127.497213); // 청주대학교 정문 근처

      if (marker) marker.setMap(null);

      marker = new naver.maps.Marker({
        position: latlng,
        map: map,
        title: "테스트 마커"
      });

      map.panTo(latlng);

      document.getElementById("result").innerHTML = "✅ 테스트 마커가 성공적으로 표시되었습니다.";
    }

    window.navermap_authFailure = function () {
      alert("네이버 지도 API 인증 실패. 키 또는 도메인 설정을 확인하세요.");
    };

    window.onload = function () {
      initMap();
      document.getElementById("recommendBtn").addEventListener("click", pickRandomRestaurant);
    };
  </script>
</head>
<body>
  <div id="info">
    <button id="recommendBtn">오늘 뭐 먹지? 🍽️</button>
    <p id="result">버튼을 눌러 학식을 추천받아보세요!</p>
  </div>
  <div id="map"></div>
</body>
</html>
