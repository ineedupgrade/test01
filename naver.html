<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>네이버 지도 예제</title>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=qmqwm6qc2t"></script>
  <script>
    window.navermap_authFailure = function () {
      alert("네이버 지도 API 인증에 실패했습니다.\n도메인 제한 또는 Key ID 설정을 확인하세요.");
      console.error("네이버 지도 인증 실패 (ncpKeyId 방식)");
    };
  </script>
</head>
<body>
  <div id="map"></div>

  <script>
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(36.6541004283298, 127.49665748627),
      zoom: 16
    });
    var marker = new naver.maps.Marker({
      position: new naver.maps.LatLng(36.6541004283298, 127.49665748627),
      map: map,
      title: "청주대학교"
    });
  </script>
</body>
</html>
