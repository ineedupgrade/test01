<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>청주대 학식 랜덤 추천</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #info {
      padding: 10px;
      background-color: #f8f8f8;
      text-align: center;
    }
    #map {
      width: 100%;
      height: 90%;
    }
    #recommendBtn {
      padding: 10px 20px;
      margin-top: 5px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8rfkydvkaa"></script>
  <script>
    let map, marker;

    const restaurants = [
      {
        name: "청림식당",
        lat: 36.6289,
        lng: 127.4575,
        info: "한식 위주 / 청대 후문 근처"
      },
      {
        name: "고봉민김밥",
        lat: 36.6293,
        lng: 127.4562,
        info: "분식 / 김밥 맛집"
      },
      {
        name: "스시유메",
        lat: 36.6278,
        lng: 127.4569,
        info: "초밥 전문 / 깔끔한 분위기"
      }
    ];

    function initMap() {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(36.6284, 127.4570),
        zoom: 16
      });
    }

    function pickRandomRestaurant() {
      const index = Math.floor(Math.random() * restaurants.length);
      const selected = restaurants[index];

      // 정보 출력
      document.getElementById('result').innerHTML = `
        <strong>${selected.name}</strong><br>${selected.info}
      `;

      // 지도 이동 + 마커
      const latlng = new naver.maps.LatLng(selected.lat, selected.lng);
      map.setCenter(latlng);

      // 기존 마커 제거
      if (marker) {
        marker.setMap(null);
      }

      // 새 마커 생성
      marker = new naver.maps.Marker({
        position: latlng,
        map: map,
        title: selected.name
      });
    }

    // 인증 실패 핸들러
    window.navermap_authFailure = function () {
      alert("네이버 지도 API 인증에 실패했습니다. 도메인 제한 또는 Key ID를 확인하세요.");
    };
  </script>
</head>
<body onload="initMap()">
  <div id="info">
    <button id="recommendBtn" onclick="pickRandomRestaurant()">오늘 뭐 먹지? 🍽️</button>
    <p id="result">아래 버튼을 눌러 추천을 받아보세요!</p>
  </div>
  <div id="map"></div>
</body>
</html>
